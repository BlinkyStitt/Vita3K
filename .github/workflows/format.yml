name: Format Check
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[".clang-format","vita3k/**","tools/**"]'
        CI_IGNORE_PATHS: '[]'
      run: python3 .github/scripts/ci_changes.py
  format-check:
    name: Format Check (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
        - vita3k
        - tools
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: ${{ matrix.path }}
    - name: Format check
      uses: jidicula/clang-format-action@v4.18.0
      with:
        check-path: ${{ matrix.path }}
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (format.yml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - format-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["format-check"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
concurrency:
  group: pr-ci-format.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
'on':
  push:
    paths:
    - .clang-format
    - vita3k/**
    - tools/**
  pull_request:
    paths:
    - '**'
