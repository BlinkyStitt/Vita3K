name: CodeQL
env:
  BUILD_CONFIG: Release
  QT_VERSION: 6.11.0
  SCCACHE_GHA_ENABLED: 'true'
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '["**.md"]'
      run: python3 .github/scripts/ci_changes.py
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        language:
        - cpp
        config:
        - Release
        cmake_preset:
        - ci-linux-clang
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up build environment
      run: bash ./.ci/setup-linux.sh x86_64 without-appimage
    - uses: mozilla-actions/sccache-action@v0.0.11
      with:
        disable_annotations: true
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        modules: qtmultimedia
        cache: true
        install-deps: 'true'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
    - name: Build
      run: 'bash ./.ci/build-desktop.sh --preset ${{ matrix.cmake_preset }} --config ${{ matrix.config }}

        '
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (codeql-analysis.yml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["analyze"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
concurrency:
  group: pr-ci-codeql-analysis.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
'on':
  push:
    branches:
    - master
    paths-ignore:
    - '**.md'
  pull_request:
    branches:
    - master
    paths:
    - '**'
  schedule:
  - cron: 0 1 * * 3
